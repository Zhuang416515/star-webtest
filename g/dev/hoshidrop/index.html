<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ほしドロップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<link rel="stylesheet" href="../shared/hoshi.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="ball"><i class="mouth"></i><i class="cheek l"></i><i class="cheek r"></i></div><div class="shadow"></div><div class="name">ほしドロップ</div><div class="dots"><span></span><span></span><span></span></div></div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7.5 4.5 3 4.5v14c4.5 0 7 .5 9 2 2-1.5 4.5-2 9-2v-14c-4.5 0-7 .5-9 2z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 6.5v14" stroke="#fff" stroke-width="1.6"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1.2 16h-2.4v-2.4h2.4zm2.3-7.6c-.4.6-1 1-1.6 1.4-.6.4-.7.7-.7 1.6h-2.4c0-1.7.5-2.4 1.5-3 .7-.5 1.2-.8 1.2-1.6 0-.7-.6-1.3-1.5-1.3s-1.6.6-1.7 1.6H7.5c.1-2.4 1.9-3.8 4.2-3.8 2.4 0 4.1 1.3 4.1 3.3 0 .7-.1 1.2-.3 1.8z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3zM15 8a5 5 0 0 1 0 8M17.5 5.5a8.5 8.5 0 0 1 0 13" stroke="#4a2a7a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M3 9h4l5-5v16l-5-5H3z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3z"/><path d="M15 9l6 6M21 9l-6 6" stroke="#4a2a7a" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="pill"><img src="img/star.webp" alt=""><span class="score" id="score">0</span></div>
  <div class="pill best"><img src="img/crown.webp" alt=""><span id="hudBest">0</span></div>
  <div class="grow"></div>
  <div class="pill next"><img id="nextImg" src="img/z0.webp" alt=""><small data-t="next"></small></div>
  <button class="round" id="pauseBtn"><svg><use href="#i-pause"/></svg></button>
</div>
<div id="toast"><img id="toastImg" src="img/z0.webp" alt=""><span><em>NEW!</em><span id="toastName"></span></span></div>

<div id="title" class="screen">
  <h1 class="logo outline" id="logo"></h1>
  <p class="sub" data-t="catch"></p>
  <div class="stage">
    <img class="orb" src="img/z3.webp" style="left:0;top:20px;animation-delay:-.4s" alt="">
    <img class="orb" src="img/z11.webp" style="right:0;top:0;animation-delay:-1.2s" alt="">
    <img class="orb" src="img/z6.webp" style="left:10px;bottom:6px;animation-delay:-2s;width:48px" alt="">
    <img class="orb" src="img/z0.webp" style="right:14px;bottom:20px;animation-delay:-.8s;width:44px" alt="">
    <img class="mascot" src="img/mascot.webp" alt="">
  </div>
  <button class="b big" id="play" data-t="play"></button>
  <div class="menu">
    <div><button class="round" id="bookBtn"><svg><use href="#i-book"/></svg></button><label data-t="book"></label></div>
    <div><button class="round" id="helpBtn"><svg><use href="#i-help"/></svg></button><label data-t="help"></label></div>
    <div><button class="round" id="soundBtn"><svg><use href="#i-sound"/></svg></button><label data-t="sound"></label></div>
  </div>
  <div class="record" id="record"><img src="img/crown.webp" alt=""><span id="titleBest"></span></div>
</div>

<div id="book" class="modal hide"><div class="card">
  <div class="ribbon" data-t="book"></div>
  <button class="round x" data-close>✕</button>
  <p class="progress" id="bookProg"></p>
  <div class="grid" id="grid"></div>
</div></div>

<div id="help" class="modal hide"><div class="card">
  <div class="ribbon" data-t="help"></div>
  <div class="steps" style="margin-top:14px">
    <div><b>1</b><span data-t="h1"></span></div>
    <div><b>2</b><span data-t="h2"></span><img src="img/z0.webp" alt=""><img src="img/z1.webp" alt="" style="width:50px"></div>
    <div><b>3</b><span data-t="h3"></span></div>
  </div>
  <button class="b" data-close data-t="ok"></button>
</div></div>

<div id="pause" class="modal hide"><div class="card"><div class="col">
  <h2 data-t="paused"></h2>
  <button class="b" id="resume" data-t="resume"></button>
  <button class="b mint" id="restart" data-t="restart"></button>
  <button class="b gold" id="toTitle" data-t="toTitle"></button>
</div></div></div>

<div id="over" class="modal hide"><div class="card">
  <div class="ribbon" data-t="over"></div>
  <img class="sleepy" src="img/sleepy.webp" alt="">
  <div class="final" id="final">0</div>
  <div id="overBest"></div>
  <div class="reach"><img id="reachImg" src="img/z0.webp" alt=""><div><small data-t="reach"></small><span id="reachName"></span></div></div>
  <div class="col">
    <button class="b" id="again" data-t="again"></button>
    <div class="row"><button class="b small mint" id="share" data-t="share"></button><button class="b small gold" id="overTitle" data-t="toTitle"></button></div>
  </div>
  <div class="promo-head" data-t="more"></div>
  <div class="promo" id="promo"></div>
</div></div>

<script>window.LIFF_IDS = { dev: "2012637666-ulR7qw8p", review: "2012637667-Wwm7OL97", app: "2012637669-q8csYDdu" };</script>
<script src="../shared/matter.min.js"></script>
<script src="../shared/hoshi.js"></script>
<script src="draw.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
