<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星占い</title>
<link rel="icon" href="TemplateData/favicon.png">
<link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
<div id="frame">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="sky"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="stage">
      <div class="orbit"><b>★</b><b>★</b><b>★</b></div>
      <img class="spirit" src="TemplateData/spirit.png" alt="">
      <div class="shadow"></div>
    </div>
    <div class="name">星占い</div>
    <div class="bar"><div class="fill" id="fill"></div><div class="star" id="star">★</div></div>
    <div class="tip" id="tip"></div>
  </div>
</div>
<script>
  var canvas = document.querySelector("#unity-canvas");
  // 加载提示固定日文（面向日本）
  var tips = ["星をあつめています…", "今日の運勢をよみこみ中…", "星霊がおめかし中…", "おみくじを準備しています…"];
  var tipEl = document.getElementById("tip"), ti = 0;
  tipEl.textContent = tips[0];
  var tipTimer = setInterval(function () { ti = (ti + 1) % tips.length; tipEl.textContent = tips[ti]; }, 1600);

  var shown = 0, target = 0;
  function setProgress(p) { target = Math.max(target, p); }
  (function animate() { // 进度条平滑前进，加载时也有一点点在动
    shown += (target - shown) * 0.08 + 0.0004;
    if (shown > target + 0.03) shown = target + 0.03;
    var w = Math.min(100, shown * 100);
    document.getElementById("fill").style.width = w + "%";
    document.getElementById("star").style.left = w + "%";
    if (!window.__loaded) requestAnimationFrame(animate);
  })();

  function done() {
    window.__loaded = true;
    clearInterval(tipTimer);
    var el = document.getElementById("loading");
    el.classList.add("out");
    setTimeout(function () { el.style.display = "none"; }, 600);
  }

  var buildUrl = "Build";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/083d292db7fbfeec5da52dd3390c64a6.data.unityweb",
    frameworkUrl: buildUrl + "/d3b053733eda74d83d83472270a72a32.framework.js.unityweb",
    codeUrl: buildUrl + "/410bb787acc81cd8d1b36f54136a681e.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "lineGame",
    productVersion: "1.0",
  };

  var script = document.createElement("script");
  script.src = buildUrl + "/e038475eee9d361473cc38697626ce5c.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) { setProgress(p * 0.95); })
      .then(function () { setProgress(1); setTimeout(done, 350); })
      .catch(function (message) { tipEl.textContent = message; });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
